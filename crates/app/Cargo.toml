[package]
name = "babeloxide-app"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true

[[bin]]
name = "BabelOxide-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio-util.workspace = true
zip = { version = "=9.2.0", default-features = false }
babeloxide-cli = { path = "../cli" }
babeloxide-config = { path = "../config" }
babeloxide-core = { path = "../core" }
babeloxide-tasks = { path = "../tasks" }
babeloxide-bridge = { path = "../babeldoc-bridge" }
babeloxide-pdf-preview = { path = "../pdf-preview" }
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts", "system_fonts", "clipboard"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
