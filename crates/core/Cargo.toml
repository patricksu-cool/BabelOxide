[package]
name = "pdf2zh-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
reqwest = { workspace = true, features = ["cookies"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
httpdate = "1.0"
regex = "1.13"
html-escape = "0.2"
unicode-general-category = "1.1"
hmac = "0.12"
sha2 = "0.10.9"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
