[project]
name = "babeloxide-dev"
version = "1.0.0"
description = "Development tools for the Rust and BabelDOC hybrid"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
