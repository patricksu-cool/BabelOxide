name: fork-build

on:
  workflow_dispatch:
  # debug purpose
  # push:

env:
  REGISTRY: ghcr.io
  REPO_LOWER: ${{ github.repository_owner }}/${{ github.event.repository.name }}
  GHCR_REPO: ghcr.io/${{ github.repository }}
  WIN_EXE_PYTHON_VERSION: 3.13.16
jobs:
  check-repository:
    name: Check if running in main repository
    runs-on: ubuntu-latest
    outputs:
      is_main_repo: ${{ github.repository == 'PDFMathTranslate-next/PDFMathTranslate-next' }}
    steps:
      - run: echo "Running repository check"

  test:
    uses: ./.github/workflows/python-test.yml
    needs: check-repository
    if: needs.check-repository.outputs.is_main_repo != 'true'

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: 
      - check-repository
      - test
    if: needs.check-repository.outputs.is_main_repo != 'true'
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Convert to lowercase
        run: |
          echo "GHCR_REPO_LOWER=$(echo ${{ env.GHCR_REPO }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REPO_LOWER }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.GHCR_REPO_LOWER }},push-by-digest=true,name-canonical=true,push=true
          cache-from: ${{ matrix.platform == 'linux/amd64' && 'type=gha' || '' }}
          cache-to: ${{ matrix.platform == 'linux/amd64' && 'type=gha,mode=max' || '' }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v5
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - check-repository
      - test
      - build
    if: needs.check-repository.outputs.is_main_repo != 'true'
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Convert to lowercase
        run: |
          echo "GHCR_REPO_LOWER=$(echo ${{ env.GHCR_REPO }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REPO_LOWER }}
          tags: |
            type=raw,value=dev
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GHCR_REPO_LOWER }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_REPO_LOWER }}:${{ steps.meta.outputs.version }}
  
  build-win64-exe:
    runs-on: windows-latest
    needs:
      - check-repository
    if: needs.check-repository.outputs.is_main_repo != 'true'
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: Setup uv with Python ${{ env.WIN_EXE_PYTHON_VERSION }}
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5
        with:
          python-version: ${{ env.WIN_EXE_PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          activate-environment: true

      - name: Download official runtime and launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Path './dep_build' -ItemType Directory -Force | Out-Null
          $pythonVersion = $env:WIN_EXE_PYTHON_VERSION
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip" -OutFile './dep_build/python.zip'
          Expand-Archive -LiteralPath './dep_build/python.zip' -DestinationPath './dep_build/runtime'
          Invoke-WebRequest -Uri 'https://github.com/skywind3000/PyStand/releases/download/1.1.4/PyStand-v1.1.4-exe.zip' -OutFile './dep_build/PyStand.zip'
          Expand-Archive -LiteralPath './dep_build/PyStand.zip' -DestinationPath './dep_build/PyStand'

      - name: Build locked portable application with DirectML
        shell: pwsh
        run: |
          ./script/build_windows.ps1 -RuntimeDirectory './dep_build/runtime' -LauncherPath './dep_build/PyStand/PyStand-x64-CLI/PyStand.exe' -Python $env:WIN_EXE_PYTHON_VERSION -DirectML -SkipOfflineAssets
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile './build/无法运行请安装vc_redist.x64.exe'
          & './dep_build/venv/Scripts/python.exe' ./script/package_windows.py --bundle ./build --finalize

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: win64-exe
          path: ./build
          if-no-files-found: error
          compression-level: 1
          include-hidden-files: true

  test-win64-exe:
    needs: 
      - build-win64-exe
      - check-repository
    if: needs.check-repository.outputs.is_main_repo != 'true'
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: win64-exe
          path: ./build

      # - name: Test show version (online mode)
      #   run: |
      #     ./build/pdf2zh_next.exe --version
      
      - name: Test - Translate a PDF file with plain text only (online mode)
        run: |
          ./build/pdf2zh.exe ./test/file/translate.cli.plain.text.pdf --output ./test/file --bing

      - name: Test - Translate a PDF file figure
        run: |
          ./build/pdf2zh.exe ./test/file/translate.cli.text.with.figure.pdf --output ./test/file --bing

      - name: Test - Translate without offline assets (online mode)
        run: |
          ./build/pdf2zh.exe ./test/file/translate.cli.plain.text.pdf --output ./test/file --bing
          
      - name: Upload test results
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: ./test/file/
          if-no-files-found: error

      - name: Setup uv with Python ${{ env.WIN_EXE_PYTHON_VERSION }}
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5
        with:
          python-version: ${{ env.WIN_EXE_PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          activate-environment: true

      - name: Generate offline assets
        shell: pwsh
        run: |
          Write-Host "==== 生成离线资源包 ===="
          uv run --active --locked --no-dev --extra directml babeldoc --generate-offline-assets ./build
          if (Test-Path -LiteralPath './build/config') {
            New-Item -Path './test/file/generated-runtime-state' -ItemType Directory -Force | Out-Null
            Move-Item -LiteralPath './build/config' -Destination './test/file/generated-runtime-state/config'
          }
          uv run --active --locked --no-dev --extra directml python ./script/package_windows.py --bundle ./build --finalize

      - name: Delete cache
        shell: pwsh
        run: |
          Write-Host "==== 删除缓存目录 ===="
          $cachePath = "$env:USERPROFILE/.cache/babeldoc"
          if (Test-Path $cachePath) {
            Remove-Item -Path $cachePath -Recurse -Force
            Write-Host "已删除缓存目录: $cachePath"
          } else {
            Write-Host "缓存目录不存在: $cachePath"
          }

      - name: Test - Translate with offline assets (offline mode)
        run: |
          Write-Host "==== 测试离线资源包 ===="
          New-Item -Path "./test/file/offline_result" -ItemType Directory -Force
          ./build/pdf2zh.exe ./test/file/translate.cli.plain.text.pdf --output ./test/file/offline_result --bing

      - name: Upload offline test results
        uses: actions/upload-artifact@v5
        with:
          name: offline-test-results
          path: ./test/file/offline_result/
          if-no-files-found: error

      - name: Upload build with offline assets artifact
        uses: actions/upload-artifact@v5
        with:
          name: win64-exe-with-assets
          path: ./build
          if-no-files-found: error
          compression-level: 1
          include-hidden-files: true
